# Zero-install developer profile: file-based H2 in MySQL compatibility mode.
# Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Uses the same Flyway migrations as MySQL. Not for production.
spring:
  datasource:
    url: jdbc:h2:file:./data/springerp-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password: ''

app:
  security:
    # Generates a random signing key when APP_JWT_SECRET is unset (tokens die on restart).
    allow-ephemeral-secret: true
    refresh-cookie-secure: false
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@springerp.local}
    # When no password is configured, a random one is printed once at first start.
    generate-password-if-missing: true

logging:
  level:
    com.springerp: DEBUG
