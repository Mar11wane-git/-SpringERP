# Base configuration. Every secret and environment-specific value is read from
# environment variables; see ../.env.example for the full list.
spring:
  application:
    name: springerp
  # Local, git-ignored KEY=VALUE files (repo root or backend/). Real environment variables win.
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/springerp?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:springerp}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_absent
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: SpringERP
    version: '@project.version@'

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    correlation: '[%X{correlationId:-}] '
  level:
    root: INFO
    com.springerp: INFO

app:
  security:
    jwt:
      secret: ${APP_JWT_SECRET:}
      issuer: springerp
      access-token-ttl: ${APP_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:P7D}
    allow-ephemeral-secret: false
    refresh-cookie-secure: ${APP_COOKIE_SECURE:true}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    max-failed-logins: 5
    lockout-duration: PT15M
    login-rate-limit-per-minute: 10
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    generate-password-if-missing: false
  storage:
    documents-dir: ${APP_DOCUMENTS_DIR:./data/documents}
  demo-data:
    enabled: ${APP_DEMO_DATA:false}
    user-password: ${APP_DEMO_USER_PASSWORD:}
