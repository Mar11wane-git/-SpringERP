# Serves the SPA and proxies /api to the backend, so the browser sees a single origin
# (the refresh cookie is SameSite=Strict and the API needs no CORS).

# Scheme seen by the client: from the TLS proxy in front (Caddy) when present.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # If another proxy terminates TLS in front of nginx, trust ONLY its address so the
    # real client IP reaches the API (rate limiting, audit log). Example:
    #   set_real_ip_from 10.0.0.5;
    #   real_ip_header X-Forwarded-For;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
